<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About Me</title>
  <link rel="stylesheet" href="/styles/reset.css" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/page.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <style>
    .about-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-lg);
      max-width: 600px;
      margin: 0 auto;
      padding: var(--space-lg);
      text-align: center;
    }

    .about-container h2 {
      font-size: 2rem;
    }

    .about-photo {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--color-accent);
    }

    .about-bio {
      font-size: 16px;
      line-height: 1.7;
      color: var(--color-text);
    }

    .social-buttons {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      width: 100%;
      max-width: 320px;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .social-btn {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: 10px 22px;
      border: 2px solid var(--color-text);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: var(--color-text);
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }

    .social-btn:hover {
      background: var(--color-text);
      color: var(--color-background-page);
    }

    .social-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      fill: currentColor;
    }

    .social-btn span {
      flex: 1;
      text-align: left;
    }
  </style>
</head>
<body>
  <header>
    <a href="/index.html" aria-label="Home"><svg class="icon" aria-hidden="true"><use href="/icons/cats.svg#icon-plump-cat" /></svg></a>
    <div class="header-title">
      <h1>Maddie's Recipe Collection</h1>
      <p class="header-subtitle">Maddie's homemade recipe collection</p>
    </div>
    <nav aria-label="site">
      <a href="/auth/sign-in.html">Sign In</a>
      <a href="/auth/sign-up.html">Sign Up</a>
    </nav>
  </header>

    <div class="about-container">
      <h2>About Me</h2>

      <img src="/images/maddie.jpg" alt="Photo of Maddie" class="about-photo" />

        Fun facts about me coming soon! Check back later to learn more about the person behind these recipes.

    </div>
  </main>
