<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- links to fonts and stylesheets omitted -->
    <script type="importmap">
      {
        "imports": {
          "@unbndl/auth": "https://unpkg.com/@unbndl/auth",
          "@unbndl/html": "https://unpkg.com/@unbndl/html",
          "@unbndl/view": "https://unpkg.com/@unbndl/view"
        }
      }
    </script>
    <script type="module">
      import { define } from "@unbndl/html";
      import { Auth } from "@unbndl/auth";
      import { LoginFormElement } from "/js/login-form.js";

      define({
        "auth-provider": Auth.Provider,
        "login-form": LoginFormElement
      });
    </script>
    <style>    /* CSS omitted */  </style>
  </head>
  <body class="page">
    <auth-provider>
      <h2>User Login</h2>
      <main class="card">
        <login-form api="/auth/login">
          <label>
            <span>Username:</span>
            <input name="username" autocomplete="off" />
          </label>
          <label>
            <span>Password:</span>
            <input type="password" name="password" />
          </label>
        </login-form>
      </main>
      <p>
        New here? <a href="/auth/sign-up.html">Create an account</a>
      </p>
    </auth-provider>
  </body>
</html>
