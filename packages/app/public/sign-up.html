<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account – Maddie's Recipe Collection</title>
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/page.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <script type="importmap">
      {
        "imports": {
          "@unbndl/auth": "https://unpkg.com/@unbndl/auth",
          "@unbndl/html": "https://unpkg.com/@unbndl/html",
          "@unbndl/view": "https://unpkg.com/@unbndl/view"
        }
      }
    </script>
    <script type="module">
      import { define } from "@unbndl/html";
      import { Auth } from "@unbndl/auth";

      const FORM_STYLES = `
        :host { display: block; }
        form {
          display: flex;
          flex-direction: column;
          gap: var(--space-md);
        }
        ::slotted(label) {
          display: flex !important;
          flex-direction: column !important;
          gap: var(--space-xs) !important;
          font-family: var(--font-sans);
          font-size: var(--text-sm);
          font-weight: 500;
          color: var(--ink-muted);
          text-align: left;
        }
        button[type="submit"] {
          margin-top: var(--space-xs);
          padding: 12px 22px;
          background: var(--accent);
          color: var(--ink-on-accent);
          font-family: var(--font-sans);
          font-size: var(--text-base);
          font-weight: 600;
          letter-spacing: 0.2px;
          border: 0;
          border-radius: var(--radius-sm);
          cursor: pointer;
          transition:
            background var(--duration-fast) var(--ease),
            transform var(--duration-fast) var(--ease);
        }
        button[type="submit"]:hover {
          background: color-mix(in srgb, var(--accent) 85%, black);
        }
        button[type="submit"]:active {
          transform: translateY(1px);
        }
      `;

      class LoginFormElement extends HTMLElement {
        constructor() {
          super();
          const root = this.attachShadow({ mode: "open" });
          const style = document.createElement("style");
          style.textContent = FORM_STYLES;
          const form = document.createElement("form");
          form.innerHTML = `<slot></slot><button type="submit"><slot name="submit-label">Create account</slot></button>`;
          root.append(style, form);
          root.addEventListener("submit", (ev) => this.submitLogin(ev));
        }

        submitLogin(event) {
          event.preventDefault();
          const endpoint = this.getAttribute("api") || "#";
          const username = this.querySelector("[name=username]").value;
          const password = this.querySelector("[name=password]").value;
          fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          })
            .then((res) => {
              if (!res.ok) throw `Status ${res.status}`;
              return res.json();
            })
            .then(({ token }) => {
              this.dispatchEvent(
                new CustomEvent("auth:message", {
                  bubbles: true,
                  composed: true,
                  detail: ["auth/signin", { token, redirect: "/app" }],
                }),
              );
            })
            .catch(console.error);
        }
      }

      define({
        "auth-provider": Auth.Provider,
        "login-form": LoginFormElement,
      });
    </script>
  </head>
  <body>
    <auth-provider>
      <main class="page">
        <header class="auth-header">
          <h2>Create your account</h2>
          <p>Start saving recipes you love</p>
        </header>
        <div class="card">
          <login-form api="/auth/register">
            <label>
              <span>Username</span>
              <input name="username" autocomplete="username" required />
            </label>
            <label>
              <span>Password</span>
              <input
                type="password"
                name="password"
                autocomplete="new-password"
                required
              />
            </label>
            <span slot="submit-label">Create account</span>
          </login-form>
        </div>
        <p>Already have an account? <a href="/login.html">Sign in</a></p>
      </main>
    </auth-provider>
  </body>
</html>
