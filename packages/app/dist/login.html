<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Maddie's Recipe App</title>
  <link rel="stylesheet" href="/styles/reset.css" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/page.css" />
  <script type="importmap">
  {
    "imports": {
      "@unbndl/auth": "https://unpkg.com/@unbndl/auth",
      "@unbndl/html": "https://unpkg.com/@unbndl/html",
      "@unbndl/view": "https://unpkg.com/@unbndl/view"
    }
  }
  </script>
  <script type="module">
    import { define } from "@unbndl/html";
    import { Auth } from "@unbndl/auth";

    class LoginFormElement extends HTMLElement {
      constructor() {
        super();
        const form = document.createElement("form");
        form.innerHTML = `<slot></slot><button type="submit">Login</button>`;
        this.attachShadow({ mode: "open" }).appendChild(form);
        this.shadowRoot.addEventListener("submit", (ev) => this.submitLogin(ev));
      }

      submitLogin(event) {
        event.preventDefault();
        const endpoint = this.getAttribute("api") || "#";
        const username = this.querySelector("[name=username]").value;
        const password = this.querySelector("[name=password]").value;
        fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        })
          .then((res) => { if (!res.ok) throw `Status ${res.status}`; return res.json(); })
          .then(({ token }) => {
            this.dispatchEvent(new CustomEvent("auth:message", {
              bubbles: true, composed: true,
              detail: ["auth/signin", { token, redirect: "/app" }]
            }));
          })
          .catch(console.error);
      }
    }

    define({
      "auth-provider": Auth.Provider,
      "login-form": LoginFormElement
    });
  </script>
</head>
<body>
  <auth-provider>
    <main class="page">
      <h2>User Login</h2>
      <div class="card">
        <login-form api="/auth/login">
          <label>
            <span>Username:</span>
            <input name="username" autocomplete="off" />
          </label>
          <label>
            <span>Password:</span>
            <input type="password" name="password" />
          </label>
        </login-form>
      </div>
      <p>New here? <a href="/auth/sign-up.html">Create an account!</a></p>
    </main>
  </auth-provider>
</body>
</html>
